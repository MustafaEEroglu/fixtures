name: Fikstürü güncelle

on:
  schedule:
    - cron: "0 5,17 * * *"   # UTC 05:00 ve 17:00 (TR 08:00 / 20:00)
  workflow_dispatch:          # elle tetikleme
  push:
    paths:
      - teams.json
      - build.py

permissions:
  contents: write

concurrency:
  group: build-fixtures
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python build.py

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "fixture-bot"
          git config user.email "fixture-bot@users.noreply.github.com"
          git add fixtures.ics
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "fixtures: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
